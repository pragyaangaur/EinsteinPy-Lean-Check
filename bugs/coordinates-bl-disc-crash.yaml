id: coordinates-bl-disc-crash
title: cartesian_to_bl raises ZeroDivisionError on the ring disc and for points just above it, and loses digits there
area: Coordinates
kind: crash
severity: medium
einsteinpy_commit: 63e1c54537a385c9f56d7d4075b0261ddaa96069
source: src/einsteinpy/coordinates/utils.py:66-91 (the lines w, r and theta of cartesian_to_bl and cartesian_to_bl_novel)
property: EinsteinpyLean.Coordinates.bl_disc_not_total
summary: >
  The radius is found as `r = sqrt(0.5 * (w + sqrt(w**2 + 4 alpha**2 z**2)))` and the polar angle as `arccos(z / r)`. On the equatorial disc inside the ring, `z = 0` and `x**2 + y**2 < alpha**2`, the inner square root is `|w|` with `w < 0`, so `r = 0` and `z / r` raises `ZeroDivisionError` (numba uses Python's error model). The same cancellation hits points off the disc: with `alpha = 1` the point `(0.5, 0, 1e-9)` has the true radius `1.15e-9` but the code computes `r = 0` and raises, and at `z = 1e-7` the radius is already wrong in the fourth digit (`1.1542e-07` against `1.1547e-07`). The tutorial point of issues 343 and 500 lies on the disc. A stable form for `w < 0` is `r**2 = 2 alpha**2 z**2 / (-w + sqrt(w**2 + 4 alpha**2 z**2))`. Properties `bl_disc_not_total`, `bl_near_disc_not_total` and `bl_near_disc_radius_inaccurate` are the three refutations.
upstream: >
  KNOWN-CLOSED, issues https://github.com/einsteinpy/einsteinpy/issues/500 and #343 report the same traceback for the point of the user guide (a = 0.5 km, Cartesian (0.265, -0.153, 0) km, which is on the disc). Both were closed in 2020 without a fix, and the code on 63e1c54 still raises. Open pull requests 686, 656 and 644 restructure the coordinates module and do not change the formula.

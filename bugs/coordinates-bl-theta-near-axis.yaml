id: coordinates-bl-theta-near-axis
title: cartesian_to_bl finds theta with arccos and loses it near the axis
area: Coordinates
kind: wrong-result
severity: low
einsteinpy_commit: 63e1c54537a385c9f56d7d4075b0261ddaa96069
source: src/einsteinpy/coordinates/utils.py:66-91 (`theta = np.arccos(z / r)`)
property: EinsteinpyLean.Coordinates.bl_theta_near_axis_inaccurate
summary: >
  For `a = 0` Boyer-Lindquist is spherical, and `cartesian_to_spherical` uses `arctan2(hxy, z)`, which is accurate near the axis. `cartesian_to_bl` uses `arccos(z / r)`, and `z / r` rounds to `1.0` as soon as `x < 1.5e-8 z`. The point `(1e-9, 0, 1)` gets `theta = 0.0` where the spherical conversion gives `1e-09`, at `x = 1e-5` the relative error is `4e-8`, and the round trip back to Cartesian then drops the whole `x` offset. The same holds for `a != 0`, where `arctan2(sqrt(r**2 + alpha**2 - ...), z)` style formulas would not lose it.
upstream: NEW, searched einsteinpy issues and pull requests for "cartesian_to_bl", "arccos", "theta precision", "Boyer-Lindquist conversion" and "convert_bl" on 24 Nov 2026. Only the zero division reports 343 and 500 show up, which are a different failure.

id: curvature-einstein-float-half
title: EinsteinTensor.from_metric multiplies by the Python float 0.5, so exact values become inexact floats
area: Curvature
kind: wrong-result
severity: medium
einsteinpy_commit: 63e1c54537a385c9f56d7d4075b0261ddaa96069
source: src/einsteinpy/symbolic/einstein.py:54-56
property: EinsteinpyLean.Curvature.einstein_exact_zero_component
summary: >
  The Einstein tensor is built as `t_ricci.tensor() - (1 / 2) * g * R`. In Python `1 / 2` is the float `0.5`, so sympy turns the exact rational expressions into floats with 15 digits. For the metric diag(-1, 1 + x^2/3, 1 + t x/5) at t = 1/3, x = 1/2 the yy component of `Ric - R g / 2` is exactly 0, which the Lean model computes on rationals (`einstein_exact_zero_component`). einsteinpy returns -4.3e-19, and the tt component is the float 0.0055415648147578 instead of the fraction 900/162409. The stress-energy tensor is built on this class and has the same problem, and it also multiplies by the float `np.pi`. Vacuum solutions and the identically zero two dimensional Einstein tensor are therefore not recognised as zero when the result is evaluated, and `==` comparisons with exact values fail. The tensors that do not use `1 / 2` (Ricci, Riemann, Weyl, Schouten) stay exact.
upstream: KNOWN-CLOSED, issue https://github.com/einsteinpy/einsteinpy/issues/591 ("0.5 appears in Ricci tensor", closed in October 2022 as wontfix on the grounds that only the look of the output is affected). The reproducer here shows that the values are also inexact, which that discussion did not cover. The proposed one line fix in #591 (`... * r_scalar.expr / 2`) was not applied.

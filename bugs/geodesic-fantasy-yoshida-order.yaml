id: geodesic-fantasy-yoshida-order
title: GeodesicIntegrator with order 6 or 8 is only second order, because every level of the triple jump reads _Z(self.order)
area: Geodesic
kind: wrong-result
severity: high
einsteinpy_commit: 63e1c54537a385c9f56d7d4075b0261ddaa96069
source: src/einsteinpy/integrators/fantasy.py:192-260 (_ord_4, _ord_6 and _ord_8 each call _Z(self.order))
property: EinsteinpyLean.Geodesic.SpecIntegrator.z6_cubic_condition_fails
summary: >
  The scheme of order 2k is built by a Yoshida triple jump of the scheme of order 2k - 2, with the constants `Z0 = -x / (2 - x)` and `Z1 = 1 / (2 - x)` for `x = 2^(1/(2k - 1))`, so the constants depend on the order of the level. `_ord_4`, `_ord_6` and `_ord_8` all call `_Z(self.order)`, the order of the whole integrator. For `order=4` that is right. For `order=6` the inner fourth order level uses the constants of `x = 2^(1/5)` instead of `2^(1/3)`, and for `order=8` the fourth and sixth order levels use `x = 2^(1/7)`. The three steps still add up to one (`2 Z1 + Z0 = 1` for any `x`), but the order condition `2 Z1^3 + Z0^3 = 0` of the fourth order level fails: it equals `0.785` for `_Z(6)`, so the inner level is not fourth order and the whole scheme stays second order. On a Schwarzschild orbit (r = 10, time like, 8 units of proper time) the observed order of convergence against a high accuracy reference is 2.0 for order 2, 3.8 for order 4, 2.0 for order 6 and 2.0 for order 8, and the order 6 scheme with each level reading its own `_Z` converges with order 5.5 on the same orbit. Orders 6 and 8 are documented ("Integration Order") and cost 9 and 27 second order steps per step, with no gain in accuracy over order 2. The fix is to call `_Z(4)` in `_ord_4`, `_Z(6)` in `_ord_6` and `_Z(8)` in `_ord_8`. The properties are `z6_cubic_condition_fails` and `z8_quintic_condition_fails` over the reals, and `ord6_inner_level_wrong` and `ord8_inner_levels_wrong` for the model (the two compositions differ in the bits), with `z_outer_condition` and `ord4_correct` showing that the outermost level is right.
upstream: NEW. Issues and pull requests of einsteinpy were searched for Yoshida, triple jump, symplectic, FANTASY, order 6 and order 8 on 24 November 2026. Pull request 548 (closed) added the integrator and has no discussion of the higher orders, and open pull requests 673 and 685 do not touch the coefficients. integrators/fantasy.py on main is byte for byte the pinned file.

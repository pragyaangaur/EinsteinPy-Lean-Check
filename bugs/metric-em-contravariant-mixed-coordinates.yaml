id: metric-em-contravariant-mixed-coordinates
title: Kerr-Newman contravariant potential and field tensor mix the coordinates t and c t
area: Metric
kind: inconsistent
severity: medium
einsteinpy_commit: 63e1c54537a385c9f56d7d4075b0261ddaa96069
source: src/einsteinpy/metric/kerrnewman.py:433-454 and 498-520
property: EinsteinpyLean.Metric.Spec.em_tensor_contravariant_invariant_wrong and EinsteinpyLean.Metric.Spec.em_potential_contravariant_invariant_wrong
summary: >
  `metric_covariant` is written in the coordinate `t` (`g_tt = c**2 * (...)`), but `em_potential_covariant` and `em_tensor_covariant` are written with `x^0 = c t`, as the comment at kerrnewman.py:343-347 says, and `_f_vec_bl` converts them with a factor of `c` before use. `em_potential_contravariant` and `em_tensor_contravariant` multiply the `c t` objects with the inverse metric of `t` and do not convert, so the result is a tensor in neither coordinate. For a Reissner-Nordstrom hole (`a = 0`) the Lorentz scalars come out wrong by `1 / c**2`: `F_ab F^ab` is `-2 E**2 / c**2` instead of `-2 E**2`, and `A_a A^a` is `A_0**2 / (c**2 f)` instead of `A_0**2 / f`. For `a != 0` the potential mixes `A_0` and `A_phi` with the wrong relative weight, and the contravariant tensor fails Maxwell's equation `d_mu (sqrt(-g) F^(mu nu)) = 0` with a relative residual of 0.2, while the same tensor built consistently in `t` or in `c t` satisfies it to 1e-8. The existing test only checks that the tensor is skew-symmetric.
upstream: >
  NEW, searched einsteinpy issues and PRs for "em_tensor_contravariant", "contravariant electromagnetic", "maxwell tensor" and "Kerr-Newman" on 24 Nov 2026. Related but different are #144 and PR #687 (the charge scaling of the Lorentz force, fixed on main, still holds here), #145 (tests for Kerr-Newman, open) and #503 and #546 (the old `kerrnewman_utils` contravariant tensor, closed). Main is still at 63e1c54 and kerrnewman.py has not changed since #687

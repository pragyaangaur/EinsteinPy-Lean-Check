id: metric-kerr-dgdx-phiphi-sign
title: Kerr dg_dx_bl has the wrong sign in the r derivative of g_phiphi, so three Christoffel symbols are off
area: Metric
kind: wrong-result
severity: high
einsteinpy_commit: 63e1c54537a385c9f56d7d4075b0261ddaa96069
source: src/einsteinpy/metric/kerr.py:172-174 (`dgdx[1, 3, 3]` in `_dg_dx_bl`), used by `_ch_sym_bl` at kerr.py:240-264
property: EinsteinpyLean.Metric.Spec.kerr_dg_phiphi_not_derivative
summary: >
  `g_phiphi = -(r**2 + alpha**2 + r_s r (alpha sin th)**2 / sigma) sin(th)**2`, so its derivative in `r` is `(-2 r - (alpha sin th)**2 tmp) sin(th)**2` with `tmp = r_s d(r/sigma)/dr`. The code has `(-2 r + (alpha sin th)**2 tmp) sin(th)**2`, a plus sign on the second term. The entry feeds `Gamma^r_{phi phi}`, `Gamma^t_{r phi}` and `Gamma^phi_{r phi}`, which are therefore wrong in `Kerr._christoffels` and in the Kerr geodesic right-hand side `_f_vec`. The error is a few parts in a thousand far from the hole and several percent near it (5 percent at `a = 0.99`, `r = 1.33 r_s`). The Kerr-Newman copy of the formula (kerrnewman.py:228-242) is correct, and so are the other 13 entries. The existing test compares `christoffels` with a formula that calls the same `_dg_dx_bl`, so it cannot see this. Numerical derivative, sympy and mpmath at 50 digits all agree with the corrected sign.
upstream: >
  RELATED, searched einsteinpy issues and PRs for "Kerr christoffel", "_dg_dx_bl", "Kerr metric derivative" and "Kerr geodesic" on 24 Nov 2026. #523 (closed) lists "fix metric derivatives (`_dg_dx`) and Christoffel symbol (`_ch_sym`) methods" as an unticked second step after the `c**2` fix, but nothing reports this sign. Main is still at 63e1c54 and kerr.py has not changed since 2022

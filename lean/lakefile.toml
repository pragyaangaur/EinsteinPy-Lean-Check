name = "EinsteinpyLean"
defaultTargets = ["EinsteinpyLean", "epdiff"]

[[require]]
name = "physlib"
git = "https://github.com/leanprover-community/physlib"
rev = "cbd02238fd1414edd9fa34871acc2a0fcdc20c21"

[[lean_lib]]
name = "EinsteinpyLean"

[[lean_exe]]
name = "epdiff"
root = "Main"

[[lean_exe]]
name = "epdiff_tensor"
root = "exe.Tensor"

[[lean_exe]]
name = "epdiff_helpers"
root = "exe.Helpers"

[[lean_exe]]
name = "epdiff_curvature"
root = "exe.Curvature"

[[lean_exe]]
name = "epdiff_predefined"
root = "exe.Predefined"

[[lean_exe]]
name = "epdiff_utils"
root = "exe.Utils"

[[lean_exe]]
name = "epdiff_coordinates"
root = "exe.Coordinates"

[[lean_exe]]
name = "epdiff_metric"
root = "exe.Metric"

[[lean_exe]]
name = "epdiff_geodesic"
root = "exe.Geodesic"
